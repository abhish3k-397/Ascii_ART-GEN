version: '3.8'

services:
  ascii-art-gen:
    build: .
    container_name: ascii-art-gen
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - SECRET_KEY=${SECRET_KEY:-change-this-random-key}
      - DEBUG=false
      - PORT=5000
      - RATE_LIMIT_ENABLED=true
      - LOG_LEVEL=INFO
      - LOG_FILE=logs/app.log
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
