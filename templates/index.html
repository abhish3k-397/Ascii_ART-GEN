<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASCII Art Generator</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <header>
            <div class="header-top">
                <div>
                    <h1>ASCII Art Generator</h1>
                    <p>Transform your images into stunning ASCII art</p>
                </div>
                <button class="theme-toggle" id="themeToggle" title="Toggle theme">
                    <div class="toggle-thumb">
                        <span id="themeIcon">☀</span>
                    </div>
                </button>
            </div>
        </header>

        <div class="main-grid">
            <aside class="glass-panel controls-panel">
                <div class="upload-zone" id="uploadZone">
                    <input type="file" id="imageInput" accept="image/*">
                    <span class="upload-icon">🖼️</span>
                    <p>Drag & drop your image here<br>or <span class="browse">browse</span></p>
                </div>

                <div class="preview-image" id="previewImage">
                    <img id="previewImg" src="" alt="Preview">
                </div>

                <div class="controls">
                    <div class="control-group">
                        <label>Width (characters)</label>
                        <input type="range" id="width" min="30" max="200" value="100">
                        <div class="value-display" id="widthValue">100</div>
                    </div>

                    <div class="control-group">
                        <label>Vertical Scale</label>
                        <input type="range" id="verticalScale" min="1" max="4" value="2">
                        <div class="value-display" id="verticalScaleValue">2</div>
                    </div>

                    <div class="control-group">
                        <label>Zoom (output size)</label>
                        <input type="range" id="zoom" min="0.1" max="3" step="0.1" value="1">
                        <div class="value-display" id="zoomValue">1.0x</div>
                    </div>

                    <div class="control-group">
                        <label>Character Set</label>
                        <input type="text" id="charSet" value="@%#*+=-:. ">
                        <div class="char-presets">
                            <button class="preset-btn" data-chars="@%#*+=-:. ">Standard</button>
                            <button class="preset-btn" data-chars="█▓▒░ ">Blocks</button>
                            <button class="preset-btn" data-chars="MWN$KXB@#*+;:,.. ">Detailed</button>
                            <button class="preset-btn" data-chars=".-':!^~*+oOXHO█">Simple</button>
                        </div>
                    </div>

                    <div class="control-group">
                        <label>Color Theme</label>
                        <div class="theme-selector">
                            <button class="theme-btn active" data-theme="light">
                                <span class="theme-preview light"></span>
                                Light
                            </button>
                            <button class="theme-btn" data-theme="warm">
                                <span class="theme-preview warm"></span>
                                Warm
                            </button>
                            <button class="theme-btn" data-theme="colorful">
                                <span class="theme-preview colorful"></span>
                                Colorful
                            </button>
                        </div>
                    </div>

                    <div class="control-group">
                        <div class="checkbox-group">
                            <input type="checkbox" id="reverse">
                            <span>Reverse intensity</span>
                        </div>
                    </div>

                    <button class="convert-btn" id="convertBtn" disabled>Generate ASCII Art</button>
                </div>
            </aside>

            <main class="glass-panel result-panel">
                <h2>Result</h2>
                
                <div class="empty-state" id="emptyState">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                        <rect x="3" y="3" width="18" height="18" rx="2"/>
                        <path d="M3 9h18M9 21V9"/>
                    </svg>
                    <p>Upload an image to get started</p>
                </div>

                <div class="loading" id="loading">
                    <div class="spinner"></div>
                    <p>Magic happening... ✨</p>
                </div>

                <div class="ascii-display" id="asciiDisplay" style="display: none;">
                    <img id="asciiPreview" alt="ASCII Art Preview">
                </div>

                <div class="error-message" id="errorMessage"></div>

                <div class="download-btns" id="downloadBtns">
                    <button class="download-btn" id="downloadTxt">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                            <polyline points="14 2 14 8 20 8"/>
                            <line x1="16" y1="13" x2="8" y2="13"/>
                            <line x1="16" y1="17" x2="8" y2="17"/>
                        </svg>
                        Download TXT
                    </button>
                    <button class="download-btn" id="downloadImg">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="3" width="18" height="18" rx="2"/>
                            <circle cx="8.5" cy="8.5" r="1.5"/>
                            <polyline points="21 15 16 10 5 21"/>
                        </svg>
                        Download PNG
                    </button>
                </div>
            </main>
        </div>

        <footer>
            <p>Built with ❤️ using Flask & Pillow</p>
        </footer>
    </div>

    <script>
        const themeToggle = document.getElementById('themeToggle');
        const themeIcon = document.getElementById('themeIcon');
        const html = document.documentElement;

        themeToggle.addEventListener('click', () => {
            const currentTheme = html.getAttribute('data-theme');
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';
            html.setAttribute('data-theme', newTheme);
            themeIcon.textContent = newTheme === 'light' ? '☀' : '☾';
        });

        const uploadZone = document.getElementById('uploadZone');
        const imageInput = document.getElementById('imageInput');
        const previewImage = document.getElementById('previewImage');
        const previewImg = document.getElementById('previewImg');
        const convertBtn = document.getElementById('convertBtn');
        const emptyState = document.getElementById('emptyState');
        const loading = document.getElementById('loading');
        const asciiDisplay = document.getElementById('asciiDisplay');
        const asciiPreview = document.getElementById('asciiPreview');
        const downloadBtns = document.getElementById('downloadBtns');
        const errorMessage = document.getElementById('errorMessage');

        const widthSlider = document.getElementById('width');
        const verticalScaleSlider = document.getElementById('verticalScale');
        const zoomSlider = document.getElementById('zoom');
        const charSetInput = document.getElementById('charSet');
        const reverseCheckbox = document.getElementById('reverse');

        let currentAsciiArt = '';
        let currentTheme = 'light';
        let currentZoom = 1.0;
        let isConverting = false;

        document.querySelectorAll('.theme-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.theme-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentTheme = btn.dataset.theme;
            });
        });

        widthSlider.addEventListener('input', (e) => {
            document.getElementById('widthValue').textContent = e.target.value;
        });

        verticalScaleSlider.addEventListener('input', (e) => {
            document.getElementById('verticalScaleValue').textContent = e.target.value;
        });

        zoomSlider.addEventListener('input', (e) => {
            document.getElementById('zoomValue').textContent = e.target.value + 'x';
            currentZoom = parseFloat(e.target.value);
        });

        document.querySelectorAll('.preset-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                charSetInput.value = btn.dataset.chars;
            });
        });

        uploadZone.addEventListener('click', () => imageInput.click());

        uploadZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadZone.classList.add('dragover');
        });

        uploadZone.addEventListener('dragleave', () => {
            uploadZone.classList.remove('dragover');
        });

        uploadZone.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadZone.classList.remove('dragover');
            const file = e.dataTransfer.files[0];
            if (file && file.type.startsWith('image/')) {
                handleFile(file);
            }
        });

        imageInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                handleFile(file);
            }
        });

        function handleFile(file) {
            const reader = new FileReader();
            reader.onload = (e) => {
                previewImg.src = e.target.result;
                previewImage.style.display = 'block';
                convertBtn.disabled = false;
                hideError();
            };
            reader.readAsDataURL(file);
        }

        convertBtn.addEventListener('click', async () => {
            if (!imageInput.files[0] || isConverting) return;

            isConverting = true;
            convertBtn.disabled = true;
            emptyState.style.display = 'none';
            asciiDisplay.style.display = 'none';
            downloadBtns.classList.remove('visible');
            loading.classList.add('visible');
            hideError();

            const formData = new FormData();
            formData.append('image', imageInput.files[0]);
            formData.append('width', widthSlider.value);
            formData.append('vertical_scale', verticalScaleSlider.value);
            formData.append('char_set', charSetInput.value);
            formData.append('reverse', reverseCheckbox.checked);
            formData.append('theme', currentTheme);
            formData.append('zoom', zoomSlider.value);

            try {
                const response = await fetch('/convert', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Conversion failed');
                }

                currentAsciiArt = data.ascii_art;
                currentTheme = data.theme || 'grayscale';
                if (data.image_data) {
                    asciiPreview.src = 'data:image/png;base64,' + data.image_data;
                }
                loading.classList.remove('visible');
                asciiDisplay.style.display = 'block';
                downloadBtns.classList.add('visible');

            } catch (error) {
                loading.classList.remove('visible');
                emptyState.style.display = 'flex';
                showError(error.message);
            } finally {
                isConverting = false;
                convertBtn.disabled = false;
            }
        });

        document.getElementById('downloadTxt').addEventListener('click', async () => {
            if (!currentAsciiArt) return;

            try {
                const response = await fetch('/download/txt', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ ascii_art: currentAsciiArt })
                });

                if (!response.ok) throw new Error('Download failed');

                const blob = await response.blob();
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'ascii_art.txt';
                a.click();
                URL.revokeObjectURL(url);

            } catch (error) {
                showError('Failed to download TXT');
            }
        });

        document.getElementById('downloadImg').addEventListener('click', async () => {
            if (!currentAsciiArt) return;

            try {
                const response = await fetch('/download/img/full', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ ascii_art: currentAsciiArt, theme: currentTheme })
                });

                if (!response.ok) throw new Error('Download failed');

                const blob = await response.blob();
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'ascii_art.png';
                a.click();
                URL.revokeObjectURL(url);

            } catch (error) {
                showError('Failed to download PNG');
            }
        });

        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.classList.add('visible');
        }

        function hideError() {
            errorMessage.classList.remove('visible');
        }
    </script>
</body>
</html>
